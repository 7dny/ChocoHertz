<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#180e0b"><meta name="description" content="ChocoHertz — a modular cacao and caramel sound sandbox."><title>ChocoHertz</title><link rel="icon" href="favicon.svg?v=2" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body>
